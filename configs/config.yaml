detectors:
  mmd:
    enabled: true
    backend: "alibi"
  lsdd:
    enabled: true
    backend: "alibi"
  kl:
    enabled: true
    backend: "scipy"
  embedding_drift:
    enabled: true
    backend: "sklearn"
  evidently:
    enabled: true
    backend: "evidently"