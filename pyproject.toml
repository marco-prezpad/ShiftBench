[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shiftbench"
version = "0.1.0"
description = "A multi-domain benchmark for unsupervised distribution shift detection"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Marco Pérez Padilla", email = "marco@example.com"}]
keywords = [
    "distribution-shift",
    "drift-detection",
    "benchmark",
    "machine-learning",
    "model-monitoring",
]

dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.2",
    "torch>=2.0",
    "torchvision>=0.15",
    "alibi-detect>=0.11",
    "evidently>=0.4.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "jupyter>=1.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

all = [
    "shiftbench[dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__init__.py"]