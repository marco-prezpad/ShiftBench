services:
  shiftbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: shiftbench:latest
    container_name: shiftbench
    volumes:
      - .:/workspace:cached
      - ./data:/workspace/data:rw
      - ./results:/workspace/results
      - ./embeddings:/workspace/embeddings
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/src
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tty: true
    stdin_open: true
    command: sleep infinity

  test:
    build:
      context: .
      dockerfile: Dockerfile
    image: shiftbench:latest
    container_name: shiftbench-test
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/src
      - PYTHONUNBUFFERED=1
    tty: true
    stdin_open: true
    command: sleep infinity

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    image: shiftbench:latest
    container_name: shiftbench-jupyter
    ports:
      - "8888:8888"
    volumes:
      - .:/workspace:cached
      - ./data:/workspace/data:rw
      - ./results:/workspace/results
      - ./notebooks:/workspace/notebooks
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/src
      - PYTHONUNBUFFERED=1
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tty: true
    stdin_open: true
    command: jupyter notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''